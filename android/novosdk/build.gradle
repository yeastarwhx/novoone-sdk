apply plugin: 'com.android.library'

// :compat — NovoSDK softphone API 层（自研引擎实现，包名 com.novosdk.*）
// 历史：原为 Acrobits 兼容门面（包名/类名与 Acrobits 一致，11-03 标识
// 剥离改造迁移至自有命名空间，类名/方法签名不变，行为对齐 Acrobits 的
// 语义参考系保留见各注释）。内部转发到 :sip-core（SipWebrtcEngine）。
// 宿主 App 切换引擎时替换一行依赖即可（26 形态走 App 仓内 acrobitsBridge
// 直连 cz.acrobits Maven 真身，不经本仓库）。

android {
    namespace 'com.novosdk'
    compileSdk 36

    defaultConfig {
        minSdk 26
        missingDimensionStrategy 'version', 'standard'
        consumerProguardFiles 'consumer-rules.pro'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    api project(':sip-core')
    // fastjson（App 经 fastjson 序列化 CallEvent；Dict extends JSONObject）
    api 'com.alibaba:fastjson:1.2.83'

    // 本地单测（pickLevel 分档表驱动；Build.VERSION_CODES 常量编译期内联，
    // 纯 JVM 可测无需 Robolectric）
    testImplementation 'junit:junit:4.13.2'
}
