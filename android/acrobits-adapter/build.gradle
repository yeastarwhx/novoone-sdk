apply plugin: 'com.android.library'

// :acrobits-adapter — NovoSDK API 的 Acrobits 后端（26 形态）
// 提供 com.novosdk.* 同名 API（App 代码单源），内部委托 cz.acrobits 真身。
// 与 :novosdk（自研引擎实现）同名互斥——App 依赖 if/else 二选一，两模块
// 不同时在 classpath。真身按 compileOnly：App 侧 else 分支自引 maven 真身。

android {
    namespace 'com.novosdk'
    compileSdk 36

    defaultConfig {
        minSdk 26
        consumerProguardFiles 'consumer-rules.pro'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Acrobits 真身（含传递 libsoftphone-java 的 Java API 层）
    compileOnly 'cz.acrobits:libsoftphone.video:25.3.37'
    compileOnly 'cz.acrobits:libsoftphone.data:25.3.37'
    compileOnly 'com.alibaba:fastjson:1.2.83'
    // video-java 的 POM 对 annotation 无版本声明，显式补齐（同 novoone-app）
    implementation 'androidx.annotation:annotation:1.9.1'
}
